function tb(b,i){const p=b.parentElement;[...p.children].forEach((c,j)=>c.classList.toggle('on',j==i));let e=p.nextElementSibling,j=0;while(e&&e.classList.contains('tp')){e.hidden=j++!=i;e=e.nextElementSibling}}

let L='easy',ST={},H=[],cur;
const S=()=>C[L].s,Q=()=>C[L].q;
function lvl(k){L=k;ST[k]=ST[k]||{cur:S()[0].id,H:[],i:0,sc:0,w:[],a:null};H=ST[k].H;cur=ST[k].cur;
$('#lv').innerHTML=Object.keys(C).map(x=>`<button role=tab class="${x==k?'on':''}" onclick="lvl('${x}')">${C[x].n}</button>`).join('');
draw()}
function go(id){if(cur&&cur!=id)H.push(cur);cur=id;draw()}
function back(){if(H.length){cur=H.pop();draw()}}
function nx(){const s=S(),i=s.findIndex(x=>x.id==cur);const n=s[i].nx||(s[i+1]&&s[i+1].id);if(n)go(n)}
function tg(f){document.body.classList.toggle('mo',f)}
function menu(){const s=S(),v=ST[L].v=ST[L].v||{};v[cur]=1;$('#mn').innerHTML=s.map((x,i)=>{const d=v[x.id]&&x.id!=cur;return `<button class="mi${x.id==cur?' on':''}${d?' dn':''}${x.nx&&x.id!='quiz'?' sub':''}" onclick="go('${x.id}');tg(0)"><b>${d?'✓':i+1}</b>${x.t}</button>`}).join('');$('#ttl').textContent=C[L].n;$('#pc').textContent=(s.findIndex(x=>x.id==cur)+1)+' / '+s.length;const a=$('#mn .on');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest'})}
function draw(){const s=S(),i=s.findIndex(x=>x.id==cur),c=s[i];ST[L].cur=cur;
$('#sl').innerHTML=`<h2>${c.t}</h2>`+(c.id=='quiz'?'<div id=qb></div>':c.h);if(c.id=='quiz')drawQ();
menu();$('#pg').style.width=(i+1)/s.length*100+'%';$('#pv').disabled=!H.length;
$('#nx').disabled=!!c.nb||(!c.nx&&i==s.length-1)||c.id=='quiz';
if(c.init)window[c.init]();scrollTo(0,0)}
function drawQ(){const q=Q(),st=ST[L],b=$('#qb');
if(st.i>=q.length){const p=Math.round(st.sc/q.length*100);b.innerHTML=`<p class=fb role=status><b>Нәтиже: ${st.sc}/${q.length} (${p}%)</b><br>${p>=80?'🎉 Өте жақсы!':p>=60?'Жақсы, бірақ қайталаған артық.':'Материалды қайталаңыз.'}</p>${st.w.length?'<p>Қайталауға арналған бөлімдер:</p>'+[...new Set(st.w)].map(r=>`<button class=b onclick="go('${r}')">${S().find(x=>x.id==r).t}</button> `).join(''):''}<p><button class=b onclick="rs()">Қайта тапсыру</button> <button class=b onclick="nxq()">Әрі қарай ▶</button></p>`;return}
const x=q[st.i];b.innerHTML=`<p class=mu>Сұрақ ${st.i+1}/${q.length}</p><h3>${x.q}</h3>`+x.o.map((o,k)=>`<button class=op onclick="ans(${k})">${o}</button>`).join('')+'<div id=fb role=status></div>'}
function ans(k){const st=ST[L],x=Q()[st.i];if(st.a!==null)return;st.a=k;const ok=k==x.a;if(ok)st.sc++;else st.w.push(x.r||'g');
document.querySelectorAll('.op').forEach((e,j)=>{e.classList.add(j==x.a?'ok':j==k?'er':'x');e.disabled=true});
$('#fb').innerHTML=`<p class=fb>${ok?'✓ Дұрыс!':'✗ Қате.'} ${x.e}</p><button class=b onclick="nq()">${st.i+1<Q().length?'Келесі сұрақ ▶':'Нәтиже'}</button>`}
function nq(){const st=ST[L];st.i++;st.a=null;drawQ()}
function rs(){Object.assign(ST[L],{i:0,sc:0,w:[],a:null});drawQ()}
function nxq(){const c=S().find(x=>x.id=='quiz');const s=S();const n=c.nx||s[s.findIndex(x=>x.id=='quiz')+1];if(n)go(n.id||n);else $('#qb').insertAdjacentHTML('beforeend','<p class=mu>Бұл соңғы бөлім.</p>')}
function calc(){const g=i=>+$('#'+i).value||0,b=g('cb'),s=g('cs'),k=g('ck'),o=g('co'),p=g('cp'),inc=o*p;
$('#cr').innerHTML=`CTR: <b>${s?(k/s*100).toFixed(2):0}%</b> · CR: <b>${k?(o/k*100).toFixed(2):0}%</b><br>CPA: <b>${o?Math.round(b/o):0} ₸</b> · ROI: <b>${b?((inc-b)/b*100).toFixed(1):0}%</b>`;
const m=Math.max(b,inc,1);$('#b1').setAttribute('width',b/m*270);$('#b2').setAttribute('width',inc/m*270)}
function chk(){const k=['SEO','Email','Ctx'];let ok=0;document.querySelectorAll('.mt').forEach((e,i)=>{const r=e.value==k[i];ok+=r;e.className='mt '+(r?'ok':'bad')});$('#mr').textContent=ok==3?'✓ Барлығы дұрыс!':`Дұрыс жауап: ${ok}/3. Қателерді түзетіңіз.`}
let AC,lastBad=false;
function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();setTimeout(()=>o.stop(),300)}catch(e){}}
function sim0(){lastBad=false;sim(10)}
function sim(v){const [t,c]=v<12?['Жақсы','ok']:v<35?['Орташа','mid']:v<55?['Сезімтал топтарға қауіпті','warn']:['Қауіпті — дабыл!','bad'];
$('#sv').textContent=v;const o=$('#so');o.textContent=t;o.className='pill '+c;$('#sg').style.width=Math.min(100,v/1.5)+'%';
if(c=='bad'&&!lastBad){$('#cap').textContent='🔔 Дыбыс: қысқа жоғары тонды дабыл — шектен асты!';if($('#snd').checked)beep()}
if(c!='bad')$('#cap').textContent='Дабыл жоқ.';lastBad=c=='bad'}
function viz(){const d=[...Array(7)].map(()=>8+Math.round(Math.random()*60)),n=d.filter(x=>x>35).length;
$('#vs').innerHTML=d.map((v,i)=>`<rect x=${15+i*40} y=${120-v*1.5} width=28 height=${v*1.5} fill="${v>35?'#ef4f5f':'#22b573'}"></rect><text x=${29+i*40} y=128 text-anchor=middle>${i+1}</text>`).join('')+'<line x1=5 x2=295 y1=67.5 y2=67.5 stroke-dasharray="4 3"></line>';
$('#vt').textContent=`Мәндер (мкг/м³): ${d.join(', ')}. Шектен (35) асқан күн: ${n}. Үзік сызық — шек.`}
function atest(id){const r=[];Object.keys(C).forEach(k=>{const s=C[k].s,ids=s.map(x=>x.id),txt=JSON.stringify(s);
r.push([k+': id бірегей',new Set(ids).size==ids.length]);
const t=[...txt.matchAll(/go\('(\w+)'\)/g)].map(m=>m[1]).concat(s.filter(x=>x.nx).map(x=>x.nx));r.push([k+': сілтемелер ('+t.length+') жарамды',t.every(x=>ids.includes(x))]);
r.push([k+': барлық слайдтың тақырыбы бар',s.every(x=>x.t)]);
r.push([k+': сұрақтар ('+C[k].q.length+') дұрыс құрылған',C[k].q.every(q=>q.a<q.o.length)])});
$('#'+id).innerHTML=r.map(x=>`${x[1]?'✓':'✗'} ${x[0]}`).join('<br>')}
lvl('easy');
</script></body></html>
